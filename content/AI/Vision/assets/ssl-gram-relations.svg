<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">保留关系，可以不固定特征坐标</title><desc id="description">三个二维向量在一起旋转前后具有同一个三乘三 Gram 矩阵，说明关系约束的自由度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">保留关系，可以不固定特征坐标</tspan></text><text x="42" y="105" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">三个归一化二维特征；只比较它们的点积关系</tspan></text><path d="M155,320 L335,320" fill="none" stroke="#ced9e1" stroke-width="3" marker-end="url(#arrow)"/><path d="M165,330 L165,175" fill="none" stroke="#ced9e1" stroke-width="3" marker-end="url(#arrow)"/><path d="M165,320 L270,320" fill="none" stroke="#167477" stroke-width="3"/><circle cx="270" cy="320" r="10" fill="#167477" stroke="#167477" stroke-width="2"/><path d="M165,320 L270,320" fill="none" stroke="#167477" stroke-width="3"/><circle cx="270" cy="320" r="6" fill="#167477" stroke="#167477" stroke-width="2"/><path d="M165,320 L165,215" fill="none" stroke="#bc632d" stroke-width="3"/><circle cx="165" cy="215" r="6" fill="#bc632d" stroke="#bc632d" stroke-width="2"/><text x="55" y="385" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="55" dy="0">x₁ = x₂ = (1, 0)</tspan><tspan x="55" dy="34">x₃ = (0, 1)</tspan></text><path d="M500,320 L680,320" fill="none" stroke="#ced9e1" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,330 L510,175" fill="none" stroke="#ced9e1" stroke-width="3" marker-end="url(#arrow)"/><path d="M510,320 L510,215" fill="none" stroke="#167477" stroke-width="3"/><circle cx="510" cy="215" r="10" fill="#167477" stroke="#167477" stroke-width="2"/><path d="M510,320 L510,215" fill="none" stroke="#167477" stroke-width="3"/><circle cx="510" cy="215" r="6" fill="#167477" stroke="#167477" stroke-width="2"/><path d="M510,320 L405,320" fill="none" stroke="#bc632d" stroke-width="3"/><circle cx="405" cy="320" r="6" fill="#bc632d" stroke="#bc632d" stroke-width="2"/><text x="385" y="385" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="385" dy="0">一起旋转 90°</tspan><tspan x="385" dy="34">坐标变了，点积不变</tspan></text><path d="M330,220 L385,220" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="353" y="181" font-size="23" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="353" dy="0">旋转</tspan></text><text x="755" y="164" font-size="24" fill="#20334d" text-anchor="middle" font-weight="600"><tspan x="755" dy="0">相同的 Gram 矩阵</tspan></text><rect x="676" y="196" width="67" height="67" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="709.5" y="240.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="709.5" dy="0">1</tspan></text><rect x="743" y="196" width="67" height="67" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="776.5" y="240.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="776.5" dy="0">1</tspan></text><rect x="810" y="196" width="67" height="67" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="843.5" y="240.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="843.5" dy="0">0</tspan></text><rect x="676" y="263" width="67" height="67" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="709.5" y="307.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="709.5" dy="0">1</tspan></text><rect x="743" y="263" width="67" height="67" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="776.5" y="307.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="776.5" dy="0">1</tspan></text><rect x="810" y="263" width="67" height="67" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="843.5" y="307.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="843.5" dy="0">0</tspan></text><rect x="676" y="330" width="67" height="67" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="709.5" y="374.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="709.5" dy="0">0</tspan></text><rect x="743" y="330" width="67" height="67" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="776.5" y="374.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="776.5" dy="0">0</tspan></text><rect x="810" y="330" width="67" height="67" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="843.5" y="374.89" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="843.5" dy="0">1</tspan></text><rect x="40" y="474" width="920" height="100" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="62" y="513" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="62" dy="0">Gram anchoring 对齐关系表，不要求特征逐坐标复制。</tspan><tspan x="62" dy="34">G = X Xᵀ；每行一个 patch，每项是一对特征的相似度。</tspan></text><text x="42" y="603" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">原创教学向量；不是 DINOv3 推理特征或论文实验图。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">模型认对目标，也可能因坐标变换点错</title><desc id="description">按比例绘制原图、裁块及等比缩放和补边画布，同一橙点通过逆变换回到原图的一千、二百位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">模型认对目标，也可能因坐标变换点错</tspan></text><text x="42" y="103" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">从模型画布回到原图，要逐步撤销入口变换。</tspan></text><rect x="45" y="160" width="400" height="225" rx="0" fill="#e9eef8" stroke="#526eaa" stroke-width="2"/><text x="45" y="145" font-size="25" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="45" dy="0">原图 1600 × 900</tspan></text><rect x="145" y="185" width="200" height="100" rx="0" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><circle cx="295" cy="210" r="7" fill="#bc632d" stroke="#bc632d" stroke-width="2"/><text x="148" y="318" font-size="22" fill="#167477" text-anchor="start" font-weight="400"><tspan x="148" dy="0">裁块偏移 (400, 100)</tspan><tspan x="148" dy="31">裁块大小 800 × 400</tspan></text><path d="M465,263 L545,263" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="580" y="160" width="240" height="240" rx="0" fill="#e1e6eb" stroke="#526eaa" stroke-width="2"/><rect x="580" y="220" width="240" height="120" rx="0" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><circle cx="760" cy="250" r="7" fill="#bc632d" stroke="#bc632d" stroke-width="2"/><text x="570" y="145" font-size="25" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="570" dy="0">模型画布 400 × 400</tspan></text><text x="838" y="215" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="838" dy="0">上补边</tspan><tspan x="838" dy="31">100</tspan></text><text x="580" y="433" font-size="24" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="580" dy="0">预测点 (300, 150)</tspan></text><rect x="40" y="480" width="920" height="110" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="62" y="516" font-size="25" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="62" dy="0">先减补边：(300, 50) → 除缩放 0.5：(600, 100)</tspan><tspan x="62" dy="35">再加裁块偏移：(400, 100) → 原图点：(1000, 200)</tspan></text></g></svg>

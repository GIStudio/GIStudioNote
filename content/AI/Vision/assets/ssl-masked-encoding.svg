<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">MAE 的非对称计算：先少量编码，再完整解码</title><desc id="description">四乘四网格显示可见和移除块，重编码器只接收可见块，轻解码器恢复次序并预测隐藏像素。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">MAE 的非对称计算：先少量编码，再完整解码</tspan></text><text x="42" y="105" font-size="26" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">教学例子：16 块中仅 4 块可见</tspan></text><rect x="45" y="145" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="88" y="145" width="43" height="43" rx="0" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="131" y="145" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="174" y="145" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="45" y="188" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="88" y="188" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="131" y="188" width="43" height="43" rx="0" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="174" y="188" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="45" y="231" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="88" y="231" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="131" y="231" width="43" height="43" rx="0" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="174" y="231" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="45" y="274" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="88" y="274" width="43" height="43" rx="0" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="131" y="274" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><rect x="174" y="274" width="43" height="43" rx="0" fill="#e1e6eb" stroke="#ffffff" stroke-width="2"/><text x="45" y="350" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="45" dy="0">12 块被移除</tspan></text><path d="M235,230 L315,230" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="335" y="160" width="255" height="140" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="462" y="204" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="462" dy="0">较重的编码器</tspan><tspan x="462" dy="34">只处理 4 个可见块</tspan><tspan x="462" dy="34">不加入 mask token</tspan></text><path d="M607,230 L678,230" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="705" y="203" font-size="25" fill="#167477" text-anchor="start" font-weight="400"><tspan x="705" dy="0">4 份编码结果</tspan><tspan x="705" dy="35">+ 12 个 mask token</tspan><tspan x="705" dy="35">+ 完整位置次序</tspan></text><path d="M820,303 L820,370 L600,370 L600,415" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="430" width="310" height="100" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="555" y="470" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="555" dy="0">较轻的解码器</tspan><tspan x="555" dy="35">恢复全部 16 个位置</tspan></text><path d="M385,480 L275,480" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="465" font-size="23" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="45" dy="0">预测隐藏像素</tspan><tspan x="45" dy="32">只在隐藏位置算损失</tspan></text><text x="42" y="594" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">预训练的遮挡策略；部署编码器时可使用完整图像。</tspan></text></g></svg>

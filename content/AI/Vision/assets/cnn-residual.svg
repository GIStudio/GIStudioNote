<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">残差块：保留一条直接传递路径</title><desc id="description">输入分为恒等和可训练两个分支，形状兼容后在加法节点合并。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">残差块：保留一条直接传递路径</tspan></text><text x="40" y="106" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">输入 x 与残差 F(x) 形状相同时，才能逐元素相加。</tspan></text><g id="input"><rect x="42" y="265" width="158" height="96" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="121" y="324" font-size="29" fill="#167477" text-anchor="middle" font-weight="600"><tspan x="121" dy="0">输入 x</tspan></text></g><g id="residual-branch"><path d="M205,313 L290,313" fill="none" stroke="#526eaa" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="252" width="315" height="122" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="458" y="302" font-size="27" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="458" dy="0">可训练变换</tspan><tspan x="458" dy="38">F(x)</tspan></text><path d="M623,313 L702,313" fill="none" stroke="#526eaa" stroke-width="3" marker-end="url(#arrow)"/></g><g id="identity-branch"><path d="M230,313 L230,180 L730,180 L730,280" fill="none" stroke="#167477" stroke-width="4" marker-end="url(#arrow)"/><text x="480" y="161" font-size="26" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">恒等路径 x</tspan></text></g><g id="addition"><circle cx="730" cy="313" r="31" fill="#ffffff" stroke="#20334d" stroke-width="2"/><text x="730" y="323" font-size="35" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="730" dy="0">+</tspan></text><path d="M765,313 L820,313" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="833" y="265" width="128" height="96" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="897" y="324" font-size="28" fill="#bc632d" text-anchor="middle" font-weight="600"><tspan x="897" dy="0">输出 y</tspan></text></g><text x="45" y="455" font-size="34" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="45" dy="0">y = x + F(x)</tspan></text><text x="45" y="512" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="45" dy="0">若通道数或空间尺寸变化：先匹配两路形状。</tspan><tspan x="45" dy="34">维度匹配可能需要投影；捷径不是任意数组的直接相加。</tspan></text></g></svg>

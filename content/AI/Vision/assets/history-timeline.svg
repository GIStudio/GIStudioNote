<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">视觉史：任务、表示与接口一起变化</title><desc id="description">两行时间节点，区分研究任务、分析框架、特征、架构与系统接口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">视觉史：任务、表示与接口一起变化</tspan></text><g id="milestone-1"><rect x="35" y="95" width="290" height="175" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="57" y="135" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="57" dy="0">1966</tspan></text><text x="57" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="57" dy="0">视觉任务的拆分</tspan></text><text x="57" y="227" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="57" dy="0">图地分离 · 描述 · 识别</tspan></text></g><path d="M327,185 L352,185" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><g id="milestone-2"><rect x="355" y="95" width="290" height="175" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="377" y="135" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="377" dy="0">1982</tspan></text><text x="377" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="377" dy="0">Marr 的分析框架</tspan></text><text x="377" y="227" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="377" dy="0">目标 · 算法 · 实现</tspan></text></g><path d="M647,185 L672,185" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/>
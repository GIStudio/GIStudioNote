<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" role="img" aria-labelledby="title description"><title id="title">计算机视觉：问题与研究条件的演变</title><desc id="description">三行九个代表性历史节点，从场景分析、表示理论、神经模型与主动视觉，到统计识别、数据评测、深度学习及预训练系统。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="828" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">计算机视觉：问题与研究条件的演变</tspan></text><g id="milestone-1"><rect x="35" y="95" width="290" height="175" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="57" y="135" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="57" dy="0">1960s</tspan></text><text x="57" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="57" dy="0">早期场景分析</tspan></text><text x="57" y="227" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="57" dy="0">三维实体 · 区域与对象</tspan></text></g><g id="milestone-2"><rect x="355" y="95" width="290" height="175" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="377" y="135" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="377" dy="0">1970–1980s</tspan></text><text x="377" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="377" dy="0">表示方案与计算约束</tspan></text><text x="377" y="227" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="377" dy="0">Marr · 光流估计</tspan></text></g><g id="milestone-3"><rect x="675" y="95" width="290" height="175" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="697" y="135" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="697" dy="0">1980s</tspan></text><text x="697" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="697" dy="0">神经层级模型</tspan></text><text x="697" y="227" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="697" dy="0">Neocognitron</tspan></text></g><g id="milestone-4"><rect x="35" y="315" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="57" y="355" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="57" dy="0">1988</tspan></text><text x="57" y="401" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="57" dy="0">主动视觉</tspan></text><text x="57" y="447" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="57" dy="0">控制观察，获取信息</tspan></text></g><g id="milestone-5"><rect x="355" y="315" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="377" y="355" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="377" dy="0">1990–2000s</tspan></text><text x="377" y="401" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="377" dy="0">学习与特征设计</tspan></text><text x="377" y="447" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="377" dy="0">LeNet · 检测与局部特征</tspan></text></g><g id="milestone-6"><rect x="675" y="315" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="697" y="355" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="697" dy="0">2005–2010</tspan></text><text x="697" y="401" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="697" dy="0">数据与共同评价</tspan></text><text x="697" y="447" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="697" dy="0">VOC · ImageNet</tspan></text></g><g id="milestone-7"><rect x="35" y="535" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="57" y="575" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="57" dy="0">2012–2016</tspan></text><text x="57" y="621" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="57" dy="0">深度学习扩展</tspan></text><text x="57" y="667" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="57" dy="0">分类 · 检测 · 分割</tspan></text></g><g id="milestone-8"><rect x="355" y="535" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="377" y="575" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="377" dy="0">2020–2022</tspan></text><text x="377" y="621" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="377" dy="0">预训练与神经表示</tspan></text><text x="377" y="667" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="377" dy="0">自监督 · 图文 · 三维</tspan></text></g><g id="milestone-9"><rect x="675" y="535" width="290" height="175" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="697" y="575" font-size="29" fill="#167477" text-anchor="start" font-weight="650"><tspan x="697" dy="0">2023–</tspan></text><text x="697" y="621" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="697" dy="0">提示与交互</tspan></text><text x="697" y="667" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="697" dy="0">分割 · 视觉语言系统</tspan></text></g><text x="40" y="788" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">时间段存在重叠；各方向交错发展，不表示前一方向结束。</tspan></text></g></svg>

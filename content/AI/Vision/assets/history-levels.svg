<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">Marr 的层次：三个问题，同一个系统</title><desc id="description">无流程箭头的三个平行分析层次，以及每个层次对应的桌面方向估计问题。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">Marr 的层次：三个问题，同一个系统</tspan></text><text x="38" y="97" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="38" dy="0">同一任务：从照片估计桌面方向</tspan></text><g id="level-1"><rect x="36" y="130" width="928" height="112" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="58" y="172" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="58" dy="0">计算目标</tspan></text><text x="58" y="211" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="58" dy="0">为什么计算</tspan></text><text x="320" y="170" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="320" dy="0">估计桌面朝向</tspan><tspan x="320" dy="34">为放置物体提供依据</tspan></text></g><g id="level-2"><rect x="36" y="262" width="928" height="112" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="58" y="304" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="58" dy="0">表示与算法</tspan></text><text x="58" y="343" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="58" dy="0">怎样计算</tspan></text><text x="320" y="302" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="320" dy="0">选择图像证据与中间表示</tspan><tspan x="320" dy="34">用几何或学习方法估计</tspan></text></g><g id="level-3"><rect x="36" y="394" width="928" height="112" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="58" y="436" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="58" dy="0">物理实现</tspan></text><text x="58" y="475" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="58" dy="0">在哪里实现</tspan></text><text x="320" y="434" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="320" dy="0">相机、处理器与内存</tspan><tspan x="320" dy="34">传感、执行及运行约束</tspan></text></g><text x="40" y="573" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">三个分析层次，不是依次经过的三个处理模块。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">先确定操作位置，再计算视觉 token</title><desc id="description">上部区分原图裁块和视图内部切 patch，下部计算单视图在编码与合并前后的不同长度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">先确定操作位置，再计算视觉 token</tspan></text><text x="42" y="105" font-size="26" fill="#167477" text-anchor="start" font-weight="600"><tspan x="42" dy="0">上部：裁块与 patch 处于不同层级</tspan></text><rect x="42" y="153" width="230" height="65" rx="0" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><path d="M55,164 L260,164" fill="none" stroke="#167477" stroke-width="3"/><path d="M55,172 L253,172" fill="none" stroke="#167477" stroke-width="3"/><path d="M55,180 L246,180" fill="none" stroke="#167477" stroke-width="3"/><path d="M55,188 L239,188" fill="none" stroke="#167477" stroke-width="3"/><path d="M55,196 L232,196" fill="none" stroke="#167477" stroke-width="3"/><path d="M55,204 L225,204" fill="none" stroke="#167477" stroke-width="3"/><text x="42" y="273" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="42" dy="0">一张原始长图</tspan></text><path d="M285,190 L340,190" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="142" width="112" height="100" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><rect x="490" y="142" width="112" height="100" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="360" y="273" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="360" dy="0">产生多幅局部视图</tspan></text><path d="M620,190 L675,190" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="703" y="126" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="746" y="126" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="789" y="126" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="832" y="126" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="875" y="126" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="703" y="158" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="746" y="158" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="789" y="158" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="832" y="158" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="875" y="158" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="703" y="190" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="746" y="190" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="789" y="190" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="832" y="190" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="875" y="190" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="703" y="222" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="746" y="222" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="789" y="222" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="832" y="222" width="43" height="32" rx="0" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="875" y="222" width="43" height="32" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="703" y="293" font-size="23" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="703" dy="0">每幅图内部</tspan><tspan x="703" dy="32">再做 patch embedding</tspan></text><path d="M35,347 L965,347" fill="none" stroke="#ced9e1" stroke-width="3"/><text x="42" y="389" font-size="26" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="42" dy="0">下部：独立的单视图计数例子</tspan></text><rect x="40" y="423" width="270" height="110" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="175" y="465" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="175" dy="0">448 × 448</tspan><tspan x="175" dy="35">14 × 14 patch</tspan></text><path d="M320,478 L354,478" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="423" width="270" height="110" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="500" y="465" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">编码器处理</tspan><tspan x="500" dy="35">1024 个位置</tspan></text><path d="M645,478 L679,478" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="423" width="270" height="110" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="825" y="465" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="825" dy="0">2 × 2 合并后</tspan><tspan x="825" dy="35">256 个内容 token</tspan></text><text x="40" y="582" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">编码后压缩不会撤销编码器已经付出的计算。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">候选改变，归一化概率就会改变</title><desc id="description">三个候选与四个候选的两组概率条形图，强调同一候选的分数未变而归一化值改变。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">候选改变，归一化概率就会改变</tspan></text><text x="42" y="105" font-size="26" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">同一图像；A 的分数始终为 2</tspan></text><rect x="40" y="135" width="440" height="330" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><rect x="520" y="135" width="440" height="330" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="65" y="176" font-size="25" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="65" dy="0">三个候选：分数 2、1、0</tspan></text><text x="545" y="176" font-size="25" fill="#167477" text-anchor="start" font-weight="600"><tspan x="545" dy="0">加入 D：其分数为 3</tspan></text><text x="65" y="233" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="65" dy="0">A</tspan></text><rect x="105" y="210" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="105" y="210" width="169.63644372257957" height="30" rx="0" fill="#bc632d" stroke="none" stroke-width="2"/><text x="377" y="233" font-size="23" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="377" dy="0">0.665</tspan></text><text x="65" y="288" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="65" dy="0">B</tspan></text><rect x="105" y="265" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="105" y="265" width="62.4057601189734" height="30" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><text x="377" y="288" font-size="23" fill="#526eaa" text-anchor="start" font-weight="400"><tspan x="377" dy="0">0.245</tspan></text><text x="65" y="343" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="65" dy="0">C</tspan></text><rect x="105" y="320" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="105" y="320" width="22.957796158447017" height="30" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><text x="377" y="343" font-size="23" fill="#526eaa" text-anchor="start" font-weight="400"><tspan x="377" dy="0">0.090</tspan></text><text x="545" y="233" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="545" dy="0">A</tspan></text><rect x="585" y="210" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="585" y="210" width="60.40511861292709" height="30" rx="0" fill="#bc632d" stroke="none" stroke-width="2"/><text x="857" y="233" font-size="23" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="857" dy="0">0.237</tspan></text><text x="545" y="288" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="545" dy="0">B</tspan></text><rect x="585" y="265" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="585" y="265" width="22.221801279218305" height="30" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><text x="857" y="288" font-size="23" fill="#526eaa" text-anchor="start" font-weight="400"><tspan x="857" dy="0">0.087</tspan></text><text x="545" y="343" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="545" dy="0">C</tspan></text><rect x="585" y="320" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="585" y="320" width="8.174943836421672" height="30" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><text x="857" y="343" font-size="23" fill="#526eaa" text-anchor="start" font-weight="400"><tspan x="857" dy="0">0.032</tspan></text><text x="545" y="398" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="545" dy="0">D</tspan></text><rect x="585" y="375" width="255" height="30" rx="0" fill="#e9edef" stroke="none" stroke-width="2"/><rect x="585" y="375" width="164.19813627143296" height="30" rx="0" fill="#167477" stroke="none" stroke-width="2"/><text x="857" y="398" font-size="23" fill="#167477" text-anchor="start" font-weight="400"><tspan x="857" dy="0">0.644</tspan></text><text x="42" y="517" font-size="25" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="42" dy="0">A：0.665 → 0.237；变化来自候选集的 Softmax 分母。</tspan><tspan x="42" dy="35">候选内的概率，不是对全部现实类别的正确率保证。</tspan></text><text x="42" y="598" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">教学 logits 与精确计算后四舍五入的概率，不是 CLIP 实测。</tspan></text></g></svg>

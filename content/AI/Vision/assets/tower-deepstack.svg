15,434" fill="none" stroke="#bc632d" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="401" width="210" height="65" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="840" y="442" font-size="25" fill="#526eaa" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">语言层 3  +</tspan></text><rect x="40" y="525" width="920" height="67" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="60" y="553" font-size="21" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="60" dy="0">在对应视觉位置相加；不靠额外拼入三组前缀来延长序列。</tspan><tspan x="60" dy="29">主输出的 merger 与更深层未画出；深度间距不按真实层号缩放。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">多层视觉信息，在语言层继续进入</title><desc id="description">简化的三层注入示意，三个视觉深度经专用连接器后加入前三个语言层，主干和最终分支仅作省略示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">多层视觉信息，在语言层继续进入</tspan></text><text x="42" y="104" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">Qwen3-VL：三个视觉深度 → 前三个语言层</tspan></text><text x="145" y="151" font-size="26" fill="#167477" text-anchor="middle" font-weight="600"><tspan x="145" dy="0">视觉编码器</tspan></text><text x="815" y="151" font-size="26" fill="#526eaa" text-anchor="middle" font-weight="600"><tspan x="815" dy="0">语言模型</tspan></text><rect x="50" y="185" width="190" height="65" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="145" y="226" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="145" dy="0">视觉深度 1</tspan></text><path d="M255,218 L360,218" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><rect x="380" y="185" width="240" height="65" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="500" y="226" font-size="25" fill="#bc632d" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">专用 merger</tspan></text><path d="M635,218 L715,218" fill="none" stroke="#bc632d" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="185" width="210" height="65" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="840" y="226" font-size="25" fill="#526eaa" 
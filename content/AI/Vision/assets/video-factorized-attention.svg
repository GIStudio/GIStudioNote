ect x="775" y="320" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><text x="585" y="404" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="585" dy="0">p4</tspan></text><rect x="610" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="665" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="720" y="375" width="50" height="50" rx="2" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="775" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><text x="580" y="478" font-size="24" fill="#167477" text-anchor="start" font-weight="400"><tspan x="580" dy="0">同一帧内跨位置通信</tspan></text><path d="M405,320 L530,320" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="42" y="548" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="42" dy="0">联合：16² = 256 对；拆分：4 × 4² + 4 × 4² = 128 对</tspan><tspan x="42" dy="34">仅计注意力位置对，不是完整计算量或实测加速比。</tspan></text></g></svg>

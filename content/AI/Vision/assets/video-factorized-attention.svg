<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">时空拆分：让不同方向分步通信</title><desc id="description">两个四乘四时间空间网格分别突出同位跨帧和同帧跨位置的注意力，附简化的比较计数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">时空拆分：让不同方向分步通信</tspan></text><text x="42" y="102" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">教学网格：4 帧 × 4 个空间位置；忽略 class token</tspan></text><text x="210" y="151" font-size="26" fill="#bc632d" text-anchor="middle" font-weight="600"><tspan x="210" dy="0">先沿时间方向</tspan></text><text x="135" y="193" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="135" dy="0">t1</tspan></text><text x="190" y="193" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="190" dy="0">t2</tspan></text><text x="245" y="193" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="245" dy="0">t3</tspan></text><text x="300" y="193" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="300" dy="0">t4</tspan></text><text x="85" y="239" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="85" dy="0">p1</tspan></text><rect x="110" y="210" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="165" y="210" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="220" y="210" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="275" y="210" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><text x="85" y="294" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="85" dy="0">p2</tspan></text><rect x="110" y="265" width="50" height="50" rx="2" fill="#bc632d" stroke="#ffffff" stroke-width="2"/><rect x="165" y="265" width="50" height="50" rx="2" fill="#bc632d" stroke="#ffffff" stroke-width="2"/><rect x="220" y="265" width="50" height="50" rx="2" fill="#bc632d" stroke="#ffffff" stroke-width="2"/><rect x="275" y="265" width="50" height="50" rx="2" fill="#bc632d" stroke="#ffffff" stroke-width="2"/><text x="85" y="349" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="85" dy="0">p3</tspan></text><rect x="110" y="320" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="165" y="320" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="220" y="320" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="275" y="320" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><text x="85" y="404" font-size="22" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="85" dy="0">p4</tspan></text><rect x="110" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="165" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="220" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><rect x="275" y="375" width="50" height="50" rx="2" fill="#e9eef8" stroke="#ffffff" stroke-width="2"/><text x="80" y="478" font-size="24" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="80" dy="0">同一位置跨帧通信</tspan></text><text x="710" y="151" font-size="26" fill="#167477" text-anchor="middle" font-weight="600"><tspan x="710" dy="0">再沿帧内空间</tspan></text><text x="635" y="193" font-size="2
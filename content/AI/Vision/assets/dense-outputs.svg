<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">输出问题变了，模型的责任也变了</title><desc id="description">同一双杯场景在分类、框检测、语义与实例分割中的四种输出。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">输出问题变了，模型的责任也变了</tspan></text><g id="task-0"><rect x="35" y="100" width="445" height="210" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="53" y="135" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="53" dy="0">分类</tspan></text><text x="53" y="283" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="53" dy="0">是否存在杯子</tspan></text><g transform="translate(115,172)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#e5f2f0" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><g transform="translate(298,172)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#e5f2f0" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g></g><g id="task-1"><rect x="520" y="100" width="445" height="210" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="538" y="135" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="538" dy="0">检测</tspan></text><text x="538" y="283" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="538" dy="0">每个对象一个位置框</tspan></text><g transform="translate(600,172)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#e5f2f0" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><g transform="translate(783,172)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#e5f2f0" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><rect x="591" y="162" width="99" height="83" rx="0" fill="none" stroke="#167477" stroke-width="2"/><rect x="774" y="162" width="99" height="83" rx="0" fill="none" stroke="#167477" stroke-width="2"/></g><g id="task-2"><rect x="35" y="350" width="445" height="210" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="53" y="385" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="53" dy="0">语义分割</tspan></text><text x="53" y="533" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="53" dy="0">杯子像素共用类别</tspan></text><g transform="translate(115,422)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#526eaa" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><g transform="translate(298,422)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#526eaa" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g></g><g id="task-3"><rect x="520" y="350" width="445" height="210" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="538" y="385" font-size="27" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="538" dy="0">实例分割</tspan></text><text x="538" y="533" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="538" dy="0">区分杯子 A 与杯子 B</tspan></text><g transform="translate(600,422)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#167477" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><g transform="translate(783,422)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#bc632d" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><text x="590" y="493" font-size="24" fill="#167477" text-anchor="start" font-weight="400"><tspan x="590" dy="0">A</tspan></text><text x="773" y="493" font-size="24" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="773" dy="0">B</tspan></text></g><text x="38" y="597" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="38" dy="0">同一场景，不同输出目标；颜色示意，不是模型推理结果。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">连接器要回答：长度怎样变，信息怎样读</title><desc id="description">三行数据流对比逐位置投影、固定查询瓶颈和外置视觉交叉注意力，不构造性能排名。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">连接器要回答：长度怎样变，信息怎样读</tspan></text><text x="42" y="103" font-size="24" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">比较的是数据流；三行不代表互斥的完整模型名单。</tspan></text><g id="interface-0"><rect x="40" y="136" width="920" height="120" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="60" y="172" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="60" dy="0">逐位置投影</tspan></text><text x="60" y="218" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="60" dy="0">N × dV</tspan></text><path d="M220,204 L288,204" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="205" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="310" dy="0">共享线性层 / MLP</tspan></text><path d="M568,204 L625,204" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="181" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="650" dy="0">N × dL</tspan></text><text x="650" y="223" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="650" dy="0">拼入语言序列</tspan></text></g><g id="interface-1"><rect x="40" y="276" width="920" height="120" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="60" y="312" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="60" dy="0">查询瓶颈</tspan></text><text x="60" y="358" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="60" dy="0">N × dV</tspan></text><path d="M220,344 L288,344" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="345" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="310" dy="0">K 个查询读取特征</tspan></text><path d="M568,344 L625,344" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="321" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="650" dy="0">K × dL</tspan></text><text x="650" y="363" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="650" dy="0">K 可固定，小于 N</tspan></text></g><g id="interface-2"><rect x="40" y="416" width="920" height="120" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="60" y="452" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="60" dy="0">交叉注意力</tspan></text><text x="60" y="498" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="60" dy="0">视觉特征</tspan></text><path d="M220,484 L288,484" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="485" font-size="24" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="310" dy="0">单独保留视觉条件</tspan></text><path d="M568,484 L625,484" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="461" font-size="25" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="650" dy="0">文本层读取</tspan></text><text x="650" y="503" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="650" dy="0">不全变成输入前缀</tspan></text></g><text x="42" y="603" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">N：入口位置数；K：查询输出数；dV / dL：视觉 / 语言通道数。</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">提示分割：复用图像编码，更新目标选择</title><desc id="description">图像编码被缓存，与每次更新的点框提示共同进入掩码解码器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">提示分割：复用图像编码，更新目标选择</tspan></text><g transform="translate(75,140)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#e5f2f0" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><text x="75" y="250" font-size="25" fill="#167477" text-anchor="start" font-weight="400"><tspan x="75" dy="0">图像</tspan></text><path d="M190,175 L290,175" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="115" width="265" height="125" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="443" y="160" font-size="26" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="443" dy="0">较重的图像编码</tspan><tspan x="443" dy="36">每张图计算一次</tspan></text><path d="M590,175 L670,175" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="115" width="270" height="125" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="825" y="160" font-size="26" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="825" dy="0">缓存图像特征</tspan><tspan x="825" dy="36">供多轮提示读取</tspan></text><rect x="40" y="365" width="235" height="120" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="158" y="410" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="158" dy="0">目标提示</tspan><tspan x="158" dy="35">点 / 框 / mask</tspan></text><path d="M282,425 L385,425" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="400" y="365" width="245" height="120" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="523" y="412" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="523" dy="0">轻量掩码解码</tspan><tspan x="523" dy="35">图像 + 本轮提示</tspan></text><path d="M825,246 L825,305 L523,305 L523,359" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><path d="M655,425 L745,425" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(785,387)"><path d="M0,0 L58,0 L53,55 Q29,70 5,55 Z" fill="#167477" stroke="#167477" stroke-width="3"/><path d="M58,9 C88,4 88,47 55,45" fill="none" stroke="#167477" stroke-width="5"/></g><text x="782" y="483" font-size="24" fill="#167477" text-anchor="start" font-weight="400"><tspan x="782" dy="0">候选掩码</tspan></text><text x="40" y="553" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">提示改变：重新解码；图像改变：不能沿用旧图的特征。</tspan><tspan x="40" dy="32">这里的复用关系不等同于已经确认了目标的语义身份。</tspan></text></g></svg>

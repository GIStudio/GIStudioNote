<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">滚动规划：预测以后，仍需重新观察</title><desc id="description">三条候选动作的教学距离分别为一点二、零点四、零点八，选择最小者但仅执行第一步，再循环观察。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">滚动规划：预测以后，仍需重新观察</tspan></text><text x="42" y="104" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">当前观察与状态 → 比较预测 → 只执行第一步</tspan></text><rect x="40" y="155" width="220" height="150" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="150" y="201" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">当前图像 x(t)</tspan><tspan x="150" dy="35">状态与历史 h(t)</tspan><tspan x="150" dy="35">编码为视觉特征</tspan></text><path d="M275,230 L345,230" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="142" width="305" height="77" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="387" y="174" font-size="24" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="387" dy="0">候选动作序列 A</tspan></text><text x="387" y="204" font-size="21" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="387" dy="0">预测终点到目标距离 1.2</tspan></text><rect x="365" y="236" width="305" height="77" rx="12" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><text x="387" y="268" font-size="24" fill="#167477" text-anchor="start" font-weight="600"><tspan x="387" dy="0">候选动作序列 B</tspan></text><text x="387" y="298" font-size="21" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="387" dy="0">预测终点到目标距离 0.4</tspan></text><rect x="365" y="330" width="305" height="77" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="387" y="362" font-size="24" fill="#bc632d" text-anchor="start" font-weight="600"><tspan x="387" dy="0">候选动作序列 C</tspan></text><text x="387" y="392" font-size="21" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="387" dy="0">预测终点到目标距离 0.8</tspan></text><path d="M685,275 L740,275" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><rect x="760" y="208" width="200" height="135" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="860" y="252" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="860" dy="0">选择 B</tspan><tspan x="860" dy="34">执行第一步</tspan><tspan x="860" dy="34">重新拍摄观察</tspan></text><path d="M860,355 L860,455 L150,455 L150,319" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="493" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">环境的新状态，成为下一轮规划的输入</tspan></text><text x="42" y="563" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">距离为任意单位的教学设定；预测不是实际执行结果。</tspan><tspan x="42" dy="32">可执行动作范围与安全条件，还需独立约束。</tspan></text></g></svg>

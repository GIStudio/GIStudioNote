<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">ViT 的三个数量：块数、原始维数、隐藏维数</title><desc id="description">四乘四教学网格通过展平和共享投影进入序列，附常见图像尺寸的独立算例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">ViT 的三个数量：块数、原始维数、隐藏维数</tspan></text><text x="42" y="105" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">切块是空间采样，不是物体识别。</tspan></text><rect x="45" y="150" width="45" height="45" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="90" y="150" width="45" height="45" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="135" y="150" width="45" height="45" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="180" y="150" width="45" height="45" rx="0" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><rect x="45" y="195" width="45" height="45" rx="0" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><rect x="90" y="195" width="45" height="45" rx="0" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><rect x="135" y="195" width="45" height="45" rx="0" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><rect x="180" y="195" width="45" height="45" rx="0" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><rect x="45" y="240" width="45" height="45" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><rect x="90" y="240" width="45" height="45" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><rect x="135" y="240" width="45" height="45" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><rect x="180" y="240" width="45" height="45" rx="0" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><rect x="45" y="285" width="45" height="45" rx="0" fill="#f3e9ec" stroke="#ced9e1" stroke-width="2"/><rect x="90" y="285" width="45" height="45" rx="0" fill="#f3e9ec" stroke="#ced9e1" stroke-width="2"/><rect x="135" y="285" width="45" height="45" rx="0" fill="#f3e9ec" stroke="#ced9e1" stroke-width="2"/><rect x="180" y="285" width="45" height="45" rx="0" fill="#f3e9ec" stroke="#ced9e1" stroke-width="2"/><text x="45" y="372" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="45" dy="0">小例子：4 × 4 个 patch</tspan></text><path d="M240,242 L300,242" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="157" width="155" height="170" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="397" y="205" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="397" dy="0">每块展平</tspan><tspan x="397" dy="34">P² × C</tspan><tspan x="397" dy="34">个像素数值</tspan></text><path d="M490,242 L550,242" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="570" y="157" width="140" height="170" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="640" y="205" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="640" dy="0">共享投影</tspan><tspan x="640" dy="34">D 维</tspan><tspan x="640" dy="34">向量</tspan></text><path d="M725,242 L770,242" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="798" y="135" width="140" height="12" rx="0" fill="#e9eef8" stroke="none" stroke-width="2"/><rect x="798" y="149" width="140" height="12" rx="0" fill="#e5f2f0" stroke="none" stroke-width="2"/><rect x="798" y="163" width="140" height="12" rx="0" fill="#e9eef8" stroke="none" stroke-width="2"/><rect x="798" y="177" width="140" height="12" rx="0" fill="#e5f2f0" stroke="none" stroke-width="2"/><rect x="798" y="191" widt
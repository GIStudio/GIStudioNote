<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">从截图到动作，再到可检查的结果</title><desc id="description">观察决策执行形成反馈环，底部独立验收框列出实际文件与状态检查，区分调用成功和任务成功。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">从截图到动作，再到可检查的结果</tspan></text><text x="42" y="103" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">执行循环与结果验收，承担不同的证明责任。</tspan></text><rect x="45" y="158" width="270" height="145" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="180" y="201" font-size="28" fill="#20334d" text-anchor="middle" font-weight="600"><tspan x="180" dy="0">观察</tspan></text><text x="180" y="245" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">当前截图</tspan><tspan x="180" dy="34">或结构信息</tspan></text><path d="M322,230 L355,230" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="158" width="270" height="145" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="500" y="201" font-size="28" fill="#20334d" text-anchor="middle" font-weight="600"><tspan x="500" dy="0">决策</tspan></text><text x="500" y="245" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">模型结合任务</tspan><tspan x="500" dy="34">提出受限动作</tspan></text><path d="M642,230 L675,230" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="158" width="270" height="145" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="820" y="201" font-size="28" fill="#20334d" text-anchor="middle" font-weight="600"><tspan x="820" dy="0">执行</tspan></text><text x="820" y="245" font-size="24" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">工具改变环境</tspan><tspan x="820" dy="34">返回调用结果</tspan></text><path d="M820,312 L820,375 L180,375 L180,315" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="412" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">重新观察实际变化，继续或停止</tspan></text><rect x="45" y="452" width="910" height="125" rx="12" fill="#ffffff" stroke="#ced9e1" stroke-width="2"/><text x="70" y="489" font-size="27" fill="#bc632d" text-anchor="start" font-weight="600"><tspan x="70" dy="0">独立验收</tspan></text><text x="275" y="489" font-size="23" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="275" dy="0">文件是否存在；公式和数值是否正确；目标状态是否成立</tspan><tspan x="275" dy="32">模型声称完成、工具返回成功，都不能单独代替任务检查。</tspan></text></g></svg>

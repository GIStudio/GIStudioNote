<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">统一表示，同时接受两类学习要求</title><desc id="description">二百五十六方形图像经过八倍 VAE 和二倍 latent patch 处理形成共享网格，分向理解与重建两个训练分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">统一表示，同时接受两类学习要求</tspan></text><text x="42" y="104" font-size="25" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">OpenVision 3：共享编码表示，保留不同训练分支</tspan></text><rect x="40" y="145" width="280" height="115" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="180" y="187" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">图像</tspan><tspan x="180" dy="35">256 × 256</tspan></text><path d="M330,203 L350,203" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="145" width="280" height="115" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="500" y="187" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">冻结 VAE</tspan><tspan x="500" dy="35">32 × 32 latent</tspan></text><path d="M650,203 L670,203" fill="none" stroke="#53667b" stroke-width="3" marker-end="url(#arrow)"/><rect x="680" y="145" width="280" height="115" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="820" y="187" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">ViT（patch = 2）</tspan><tspan x="820" dy="35">16 × 16 个位置</tspan></text><path d="M820,275 L820,310 L270,310 L270,355" fill="none" stroke="#167477" stroke-width="3" marker-end="url(#arrow)"/><path d="M820,275 L820,355" fill="none" stroke="#bc632d" stroke-width="3" marker-end="url(#arrow)"/><rect x="45" y="370" width="450" height="140" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="270" y="409" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="270" dy="0">理解分支</tspan><tspan x="270" dy="35">图文对比 + 描述生成</tspan><tspan x="270" dy="35">保留可迁移语义</tspan></text><rect x="535" y="370" width="425" height="140" rx="12" fill="#fff0df" stroke="#ced9e1" stroke-width="2"/><text x="747" y="409" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="747" dy="0">重建分支</tspan><tspan x="747" dy="35">ViT 解码 + VAE 解码</tspan><tspan x="747" dy="35">恢复 latent 与图像细节</tspan></text><text x="42" y="563" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">每轴 8 × 2 = 16 倍压缩；256 个位置是教学输入计数。</tspan><tspan x="42" dy="32">同一中间表示，不等于两条训练分支具有同一个解码器。</tspan></text></g></svg>

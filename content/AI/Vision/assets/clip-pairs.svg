<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">训练时：图与文字怎样相互比较</title><desc id="description">三乘三配对矩阵，三个对角正例、六个非对角负例，比较 Softmax 与 Sigmoid 的归一化。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">训练时：图与文字怎样相互比较</tspan></text><text x="42" y="105" font-size="26" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">3 组原始配对 → 9 个图文组合</tspan></text><text x="330" y="151" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">文本 T₁</tspan></text><text x="480" y="151" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">文本 T₂</tspan></text><text x="630" y="151" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="630" dy="0">文本 T₃</tspan></text><text x="160" y="219" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="160" dy="0">图像 I1</tspan></text><rect x="260" y="170" width="140" height="78" rx="4" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><text x="330" y="219" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">原配对 +</tspan></text><rect x="410" y="170" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="480" y="219" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">负例 −</tspan></text><rect x="560" y="170" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="630" y="219" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="630" dy="0">负例 −</tspan></text><text x="160" y="309" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="160" dy="0">图像 I2</tspan></text><rect x="260" y="260" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="330" y="309" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">负例 −</tspan></text><rect x="410" y="260" width="140" height="78" rx="4" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><text x="480" y="309" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">原配对 +</tspan></text><rect x="560" y="260" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="630" y="309" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="630" dy="0">负例 −</tspan></text><text x="160" y="399" font-size="25" fill="#20334d" text-anchor="middle" font-weight="400"><tspan x="160" dy="0">图像 I3</tspan></text><rect x="260" y="350" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="330" y="399" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">负例 −</tspan></text><rect x="410" y="350" width="140" height="78" rx="4" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="480" y="399" font-size="25" fill="#53667b" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">负例 −</tspan></text><rect x="560" y="350" width="140" height="78" rx="4" fill="#e5f2f0" stroke="#167477" stroke-width="2"/><text x="630" y="399" font-size="25" fill="#167477" text-anchor="middle" font-weight="400"><tspan x="630" dy="0">原配对 +</tspan></text><text x="770" y="237" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="770" dy="0">3 个正例</tspan><tspan x="770" dy="31">6 个负例</tspan><tspan x="770" dy="31">标签由配对生成</tspan></text><rect x="40" y="475" width="440" height="90" rx="12" fill="#e9eef8" stroke="#ced9e1" stroke-width="2"/><text x="65" y="510" font-size="23" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="65" dy="0">CLIP：分别沿行、列做竞争</tspan><tspan x="65" dy="32">匹配分数进入双向 Softmax</tspan></text><rect x="520" y="475" width="440" height="90" rx="12" fill="#e5f2f0" stroke="#ced9e1" stroke-width="2"/><text x="545" y="510" font-size="23" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="545" dy="0">SigLIP：各组合做二分类</tspan><tspan x="545" dy="32">仍保留非配对的负例</tspan></text><text x="42" y="601" font-size="22" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="42" dy="0">配对标签不等于完整语义真值；非对角组合也可能语义相容。</tspan></text></g></svg>

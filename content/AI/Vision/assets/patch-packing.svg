<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">NaViT 的打包：复用容器，不混合样本</title><desc id="description">三组教学序列由三个容器压至两个，配套块对角的样本注意力示意。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs><g font-family="'PingFang SC','Noto Sans CJK SC',Arial,sans-serif"><rect x="1" y="1" width="998" height="618" rx="18" fill="#fafcfd" stroke="#ced9e1" stroke-width="2"/><text x="36" y="52" font-size="29" fill="#20334d" text-anchor="start" font-weight="650"><tspan x="36" dy="0">NaViT 的打包：复用容器，不混合样本</tspan></text><text x="42" y="108" font-size="25" fill="#526eaa" text-anchor="start" font-weight="600"><tspan x="42" dy="0">逐图填充：3 × 256 = 768</tspan></text><text x="550" y="108" font-size="25" fill="#167477" text-anchor="start" font-weight="600"><tspan x="550" dy="0">打包：2 × 256 = 512</tspan></text><rect x="42" y="140" width="320" height="38" rx="0" fill="#e5e9ed" stroke="none" stroke-width="2"/><rect x="42" y="140" width="100" height="38" rx="0" fill="#167477" stroke="none" stroke-width="2"/><text x="380" y="168" font-size="24" fill="#167477" text-anchor="start" font-weight="400"><tspan x="380" dy="0">80</tspan></text><rect x="42" y="197" width="320" height="38" rx="0" fill="#e5e9ed" stroke="none" stroke-width="2"/><rect x="42" y="197" width="200" height="38" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><text x="380" y="225" font-size="24" fill="#526eaa" text-anchor="start" font-weight="400"><tspan x="380" dy="0">160</tspan></text><rect x="42" y="254" width="320" height="38" rx="0" fill="#e5e9ed" stroke="none" stroke-width="2"/><rect x="42" y="254" width="300" height="38" rx="0" fill="#bc632d" stroke="none" stroke-width="2"/><text x="380" y="282" font-size="24" fill="#bc632d" text-anchor="start" font-weight="400"><tspan x="380" dy="0">240</tspan></text><rect x="550" y="140" width="320" height="38" rx="0" fill="#e5e9ed" stroke="none" stroke-width="2"/><rect x="550" y="140" width="100" height="38" rx="0" fill="#167477" stroke="none" stroke-width="2"/><rect x="650" y="140" width="200" height="38" rx="0" fill="#526eaa" stroke="none" stroke-width="2"/><rect x="550" y="205" width="320" height="38" rx="0" fill="#e5e9ed" stroke="none" stroke-width="2"/><rect x="550" y="205" width="300" height="38" rx="0" fill="#bc632d" stroke="none" stroke-width="2"/><text x="42" y="360" font-size="25" fill="#20334d" text-anchor="start" font-weight="400"><tspan x="42" dy="0">有效 token：80 + 160 + 240 = 480</tspan><tspan x="42" dy="35">逐图 padding：768 − 480 = 288</tspan><tspan x="42" dy="35">打包 padding：512 − 480 = 32</tspan></text><text x="610" y="325" font-size="24" fill="#20334d" text-anchor="start" font-weight="600"><tspan x="610" dy="0">样本级注意力示意</tspan></text><rect x="625" y="345" width="65" height="65" rx="0" fill="#167477" stroke="#ffffff" stroke-width="2"/><rect x="690" y="345" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="755" y="345" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="625" y="410" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="690" y="410" width="65" height="65" rx="0" fill="#526eaa" stroke="#ffffff" stroke-width="2"/><rect x="755" y="410" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="625" y="475" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="690" y="475" width="65" height="65" rx="0" fill="#e5e9ed" stroke="#ffffff" stroke-width="2"/><rect x="755" y="475" width="65" height="65" rx="0" fill="#bc632d" stroke="#ffffff" stroke-width="2"/><text x="842" y="385" font-size="20" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="842" dy="0">同色内部</tspan><tspan x="842" dy="28">允许通信</tspan><tspan x="842" dy="28">跨样本屏蔽</tspan></text><text x="40" y="583" font-size="23" fill="#53667b" text-anchor="start" font-weight="400"><tspan x="40" dy="0">灰色为填充或被屏蔽关系；节省 padding 不直接等于延迟提升。</tspan></text></g></svg>
